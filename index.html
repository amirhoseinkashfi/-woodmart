<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetables WordPress theme | WoodMart</title>
    <link rel="stylesheet" href="./CSS/header&main.css">
    <link rel="stylesheet" href="./CSS/fonts.css">
</head>

<body>
    <div class="container">

        <div class="container_left">

        </div>
        <div class="container_right">

            <!--====== HEADER ====== -->
            <header class="site_header">
                <div class="top_header">
                    <ul class="left_ul">
                        <li class="top_header_link"><a href="#" class="top_header_alink">
                                About Us
                            </a></li>
                        <li class="top_header_link"><a href="#" class="top_header_alink">
                                Contact Us
                            </a></li>
                        <li class="top_header_link"><a href="#" class="top_header_alink">
                                Delivery
                            </a></li>
                    </ul>

                    <ul class="right_ul">
                        <li class="top_header_link"><a href="#" class="top_header_alink">
                                <img src="./images/icons8-location-14.png" alt="" class="img_header_top">Store Location
                            </a></li>
                        <li class="top_header_link"><a href="#" class="top_header_alink">
                                <img src="./images/icons8-phone-14.png" alt="" class="img_header_top">(956) 238-7908
                            </a></li>
                        <li class="top_header_link"><a href="#" class="top_header_alink">
                                <img src="./images/icons8-heart-14.png" alt="" class="img_header_top">Wishlist
                            </a></li>
                        <li class="top_header_link"><a href="#" class="top_header_alink">
                                <img src="./images/icons8-person-14.png" alt="" class="img_header_top">
                                Log / Register
                            </a></li>
                    </ul>
                </div>

                <div class="bottom_header">
                    <div class="first_item_in_header">
                        <a href="#" class="logo_a_link_img"><img
                                src="https://woodmart.xtemos.com/vegetables/wp-content/uploads/sites/20/2024/02/vg-logo-colored.svg"
                                class="logo_img"></a>
                    </div>

                    <div class="second_item_in_header">
                        <a href="#" class="all_categories_a_link">
                            <span class="all_categories_a_link_img_span"><img src="./images/icons8-menu-20.png"></span>
                            <span>All Categories</span>
                        </a>
                        <div class="search_box">
                            <img src="./images/icons8-search-24.png" alt="" class="search_img">
                            <span class="search_box_text">Search for product</span>
                        </div>
                        <div class="second_item_ul">
                            <ul class="three_links">
                                <li class="second_item_li">
                                    <a href="#" class="three_links_a">
                                        <img src="https://woodmart.xtemos.com/vegetables/wp-content/uploads/sites/20/2024/02/vg-popular.svg"
                                            alt="" class="three_links_a_img">Promotions
                                    </a>
                                </li>
                                <li class="second_item_li">
                                    <a href="#" class="three_links_a"><img
                                            src="https://woodmart.xtemos.com/vegetables/wp-content/uploads/sites/20/2024/02/vg-ideas-for-breakfast.svg"
                                            alt="" class="three_links_a_img">Ideas For Breakfast
                                    </a>

                                </li>
                                <li class="second_item_li">
                                    <a href="#" class="three_links_a">
                                        <img src="https://woodmart.xtemos.com/vegetables/wp-content/uploads/sites/20/2024/02/vg-discount.svg"
                                            alt="" class="three_links_a_img">Weekly Discount
                                    </a>

                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="second_item_in_header">

                    </div>
                </div>

            </header>
        </div>
    </div>

</body>

</html>
